# Reverse proxy: forwards every request coming into nginx on port 80
# to the FastAPI app running in the "api" container on port 8000.
# "api" resolves via Docker Compose's internal DNS — it's the service
# name from docker-compose.yml, not a real hostname.

server {
    listen 80;

    location / {
        proxy_pass http://api:8000;

        # Forward the original request details to the app, so its logs
        # show the real client IP/protocol instead of just "nginx".
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
