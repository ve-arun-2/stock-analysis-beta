# nginx (public) -> api (internal only). No Postgres yet (removed for now;
# add a `db` service back here once the database is set up).
#
# For every deploy: docker compose up --build -d
# This rebuilds the api image (reusing cached layers when nothing changed)
# and replaces both containers in one command — no manual stop/rm/run needed.

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"  # reachable from other containers (nginx) only, not from outside

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
