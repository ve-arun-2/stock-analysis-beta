# nginx (public) -> api (internal only) -> Supabase Postgres (external).
#
# For every deploy: docker compose up --build -d
# This rebuilds the api image (reusing cached layers when nothing changed)
# and replaces containers as needed in one command — no manual stop/rm/run.
#
# DATABASE_URL (Supabase) comes from .env via env_file below — no local db
# container. Do not add a hardcoded DATABASE_URL under api.environment here;
# it would take precedence over env_file and silently point at the wrong DB.

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"  # reachable from other containers (nginx) only, not from outside

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
